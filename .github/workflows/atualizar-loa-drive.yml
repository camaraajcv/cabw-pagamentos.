name: CABW - LOA 2026 automatica

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/drive_to_loa.py'
      - 'scripts/conciliar_valores_loa.py'
      - 'loa-2026/atualizar-loa.cjs'
      - '.github/workflows/atualizar-loa-drive.yml'
  repository_dispatch:
    types: [loa-drive-updated]
  schedule:
    - cron: '12,27,42,57 6-13 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: cabw-loa-2026
  cancel-in-progress: false

jobs:
  loa:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Usa a base publicada atual também em reexecuções.
          ref: refs/heads/main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: python -m pip install google-auth requests openpyxl

      - name: Ler fonte LOA do Google Drive
        id: fonte
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          status=0
          python scripts/drive_to_loa.py || status=$?
          case "$status" in
            0) echo "fresh=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "fresh=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=LOA 2026::CSV do Drive acima de 30 horas. Aguardando nova fonte."
              echo "LOA 2026: aguardando CSV atualizado no Drive. Dados e carimbo preservados." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$status" ;;
          esac

      - name: Converter e validar LOA
        if: steps.fonte.outputs.fresh == 'true'
        run: |
          rm -f loa-2026/dados-novos.json
          node loa-2026/atualizar-loa.cjs loa-2026/fonte.csv loa-2026/dados.json loa-2026/dados-novos.json
          if [ ! -f loa-2026/dados-novos.json ]; then
            # O importador só grava a saída quando a estrutura LOA muda.
            cp loa-2026/dados.json loa-2026/dados-novos.json
          fi
          python scripts/conciliar_valores_loa.py
          python - <<'PY'
          import json
          from pathlib import Path
          atual_path = Path("loa-2026/dados.json")
          novo_path = Path("loa-2026/dados-novos.json")
          atual = json.loads(atual_path.read_text(encoding="utf-8"))
          novo = json.loads(novo_path.read_text(encoding="utf-8"))
          atual_sem_carimbo = dict(atual, data=dict(atual["data"]))
          novo_sem_carimbo = dict(novo, data=dict(novo["data"]))
          atual_sem_carimbo["data"].pop("updatedAt", None)
          novo_sem_carimbo["data"].pop("updatedAt", None)
          if atual_sem_carimbo == novo_sem_carimbo:
              novo_path.unlink()
              print("LOA: fonte sem alteracao; nada a publicar.")
          else:
              novo_path.replace(atual_path)
              print("LOA: dados ou carimbo da fonte atualizados.")
          PY
          python -m json.tool loa-2026/dados.json > /dev/null

      - name: Commitar LOA se houver mudanca
        if: steps.fonte.outputs.fresh == 'true'
        id: publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- loa-2026/dados.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add loa-2026/dados.json
          git commit -m 'CABW: atualizar LOA 2026 pelo Drive'
          for tentativa in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1

      - name: Sincronizar branch apos publicacao
        if: steps.publicar.outputs.changed == 'true'
        run: git pull --rebase origin main

      - name: Montar GitHub Pages
        if: steps.publicar.outputs.changed == 'true'
        run: bash scripts/montar-pages.sh

      - name: Configurar GitHub Pages
        if: steps.publicar.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Preparar GitHub Pages
        if: steps.publicar.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: site-publicado

      - name: Confirmar artefato da publicacao
        if: steps.publicar.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tentativa in 1 2 3 4 5; do
            quantidade=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$quantidade" = "1" ]; then
              echo "Artefato github-pages confirmado."
              exit 0
            fi
            echo "Tentativa ${tentativa}: artefato ainda nao disponivel (quantidade: ${quantidade})."
            sleep 5
          done
          echo "ERRO: o artefato github-pages nao foi encontrado para esta execucao."
          exit 1

      - name: Publicar GitHub Pages - tentativa inicial
        if: steps.publicar.outputs.changed == 'true'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Aguardar nova tentativa do GitHub Pages
        if: (steps.publicar.outputs.changed == 'true') && steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Publicar GitHub Pages - segunda tentativa
        if: (steps.publicar.outputs.changed == 'true') && steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages


