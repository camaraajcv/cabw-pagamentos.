name: CABW - Pagamentos automaticos
# deploy-reset-2026-11-06
# force-consolidated-ui-2026-11-06-2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fornecedores.js'
      - 'painel-template.html'
      - 'painel.js'
      - 'painel.css'
      - 'scripts/publicar_pagamentos.py'
      - '.github/workflows/atualizar-pagamentos-drive.yml'
  repository_dispatch:
    types: [pagamentos-drive-updated]
  schedule:
    - cron: '7,22,37,52 6-13 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cabw-pagamentos
  cancel-in-progress: true

jobs:
  pagamentos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install google-auth requests openpyxl

      - name: Ler fonte de pagamentos do Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/drive_to_pagamentos.py

      - name: Converter e validar pagamentos
        run: |
          python scripts/converter_pagamentos.py
          python - <<'PY'
          import json, re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          m = re.search(r'<script id="dataset" type="application/json">(.*?)</script>', html, re.S)
          if not m:
              raise SystemExit("Dataset atual nao localizado no index.html")
          atual = json.loads(m.group(1))
          novo = json.loads(Path("novo-dataset.json").read_text(encoding="utf-8"))
          Path(".pagamentos-alterados").write_text("1" if atual != novo else "0")
          PY
          if [ "$(cat .pagamentos-alterados)" = "1" ]; then
            python scripts/publicar_pagamentos.py
            echo "Pagamentos: dados novos detectados."
          else
            # Sincroniza a interface (mes padrao/carimbo) mesmo sem mudanca monetaria.
            python scripts/publicar_pagamentos.py
            echo "Pagamentos: dados iguais; interface sincronizada para a competencia mais recente."
          fi

      - name: Commitar pagamentos se houver mudanca
        id: publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          cp index.html /tmp/index.html
          cp pagamentos-dados.json /tmp/pagamentos-dados.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/index.html index.html
          cp /tmp/pagamentos-dados.json pagamentos-dados.json

          if git diff --quiet -- index.html pagamentos-dados.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add index.html pagamentos-dados.json
            git commit -m 'CABW: atualizar painel de pagamentos pelo Drive'
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Montar GitHub Pages
        run: |
          mkdir -p site-publicado
          cp index.html site-publicado/index.html
          cp painel.js site-publicado/painel.js
          cp painel.css site-publicado/painel.css
          cp pagamentos-dados.json site-publicado/pagamentos-dados.json
          cp -R loa-2026 site-publicado/loa-2026
          cp -R sdpp site-publicado/sdpp
          rm -f site-publicado/loa-2026/fonte.csv site-publicado/loa-2026/dados-novos.json

      - name: Preparar GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-publicado

      - name: Publicar GitHub Pages
        uses: actions/deploy-pages@v4
