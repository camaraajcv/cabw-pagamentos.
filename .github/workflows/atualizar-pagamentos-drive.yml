name: CABW - Pagamentos automaticos
# refresh-trigger-2026-11-10
# deploy-reset-2026-11-06
# force-consolidated-ui-2026-11-06-2
# force-percent-execution-2026-11-06
# force-ug-attention-history-2026-11-06
# force-ug-aliases-2026-11-06

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fornecedores.js'
      - 'painel-template.html'
      - 'painel.js'
      - 'painel.css'
      - 'sdpp/**'
      - 'scripts/publicar_pagamentos.py'
      - 'scripts/drive_to_pagamentos.py'
      - 'scripts/montar-pages.sh'
      - '.github/workflows/atualizar-pagamentos-drive.yml'
  repository_dispatch:
    types: [pagamentos-drive-updated]
  schedule:
    - cron: '7,22,37,52 6-13 * * 1-5'
      timezone: 'America/New_York'

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: cabw-pagamentos
  cancel-in-progress: true

jobs:
  pagamentos:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Uma reexecução precisa converter sobre a base publicada atual.
          ref: refs/heads/main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install google-auth requests openpyxl

      - name: Ler fonte de pagamentos do Google Drive
        id: fonte
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          status=0
          python scripts/drive_to_pagamentos.py || status=$?
          case "$status" in
            0) echo "fresh=true" >> "$GITHUB_OUTPUT" ;;
            3)
              echo "fresh=false" >> "$GITHUB_OUTPUT"
              echo "::warning title=Pagamentos CABW::CSV do Drive acima de 30 horas úteis. Verificando a base publicada enquanto aguarda nova fonte."
              ;;
            *) exit "$status" ;;
          esac

      - name: Converter e validar pagamentos
        id: validar
        env:
          FONTE_RECENTE: ${{ steps.fonte.outputs.fresh }}
        run: |
          python scripts/converter_pagamentos.py
          python - <<'PY'
          import json, re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          m = re.search(r'<script id="dataset" type="application/json">(.*?)</script>', html, re.S)
          if not m:
              raise SystemExit("Dataset atual nao localizado no index.html")
          atual = json.loads(m.group(1))
          novo = json.loads(Path("novo-dataset.json").read_text(encoding="utf-8"))
          Path(".pagamentos-alterados").write_text("1" if atual != novo else "0")
          PY
          if [ "$FONTE_RECENTE" = "false" ]; then
            if [ "$(cat .pagamentos-alterados)" = "0" ]; then
              python scripts/publicar_pagamentos.py --somente-conferencia
              echo "publish=stamp" >> "$GITHUB_OUTPUT"
              echo "Pagamentos CABW: dados conferidos, sem mudança de valores. Aguardando CSV mais recente no Drive." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning title=Pagamentos CABW::O CSV antigo difere da base publicada. Aguardando nova fonte."
              echo "Pagamentos CABW: CSV antigo com diferenças. Base e carimbo preservados." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "$(cat .pagamentos-alterados)" = "1" ]; then
            python scripts/publicar_pagamentos.py
            echo "publish=data" >> "$GITHUB_OUTPUT"
            echo "Pagamentos: dados novos detectados."
          else
            # Sincroniza a interface (mes padrao/carimbo) mesmo sem mudanca monetaria.
            python scripts/publicar_pagamentos.py
            echo "publish=data" >> "$GITHUB_OUTPUT"
            echo "Pagamentos: dados iguais; interface sincronizada para a competencia mais recente."
          fi

      - name: Commitar pagamentos se houver mudanca
        if: steps.validar.outputs.publish != ''
        id: publicar
        env:
          PUBLICACAO: ${{ steps.validar.outputs.publish }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          arquivos=(index.html)
          mensagem='CABW: registrar conferência do painel de pagamentos'
          if [ "$PUBLICACAO" = "data" ]; then
            arquivos+=(pagamentos-dados.json)
            mensagem='CABW: atualizar painel de pagamentos pelo Drive'
          fi

          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT
          cp "${arquivos[@]}" "$temp"
          git fetch origin main
          for arquivo in "${arquivos[@]}"; do
            if [ "$(git rev-parse "HEAD:$arquivo")" != "$(git rev-parse "origin/main:$arquivo")" ]; then
              echo "::error::$arquivo mudou desde a conferência. Execute a rotina novamente."
              exit 1
            fi
          done
          git reset --hard origin/main
          for arquivo in "${arquivos[@]}"; do
            cp "$temp/$arquivo" "$arquivo"
          done

          if git diff --quiet -- "${arquivos[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add "${arquivos[@]}"
            git commit -m "$mensagem"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Montar GitHub Pages
        if: steps.fonte.outputs.fresh == 'true' || steps.publicar.outputs.changed == 'true' || github.event_name == 'push'
        id: pages
        run: bash scripts/montar-pages.sh

      - name: Configurar GitHub Pages
        if: steps.pages.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Preparar GitHub Pages
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: site-publicado

      - name: Confirmar artefato da publicacao
        if: steps.pages.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tentativa in 1 2 3 4 5; do
            quantidade=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$quantidade" = "1" ]; then
              echo "Artefato github-pages confirmado."
              exit 0
            fi
            echo "Tentativa ${tentativa}: artefato ainda nao disponivel (quantidade: ${quantidade})."
            sleep 5
          done
          echo "ERRO: o artefato github-pages nao foi encontrado para esta execucao."
          exit 1

      - name: Publicar GitHub Pages - tentativa inicial
        if: steps.pages.outcome == 'success'
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Aguardar nova tentativa do GitHub Pages
        if: (steps.pages.outcome == 'success') && steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Publicar GitHub Pages - segunda tentativa
        if: (steps.pages.outcome == 'success') && steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages



