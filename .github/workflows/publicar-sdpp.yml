name: SDPP - Validar e publicar portal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sdpp/**'
      - '.github/workflows/publicar-sdpp.yml'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: cabw-sdpp-publicacao
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar geracao dos XMLs
        run: |
          node --check sdpp/engine.js
          node --check sdpp/app.js
          node sdpp/tests/accounting.test.js
          node sdpp/tests/compatibility.test.js

      - name: Montar GitHub Pages
        run: bash scripts/montar-pages.sh

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: site-publicado

      - name: Confirmar artefato da publicacao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tentativa in 1 2 3 4 5; do
            quantidade=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$quantidade" = "1" ]; then
              echo "Artefato github-pages confirmado."
              exit 0
            fi
            echo "Tentativa ${tentativa}: artefato ainda nao disponivel (quantidade: ${quantidade})."
            sleep 5
          done
          echo "ERRO: o artefato github-pages nao foi encontrado para esta execucao."
          exit 1

      - name: Publicar GitHub Pages - tentativa inicial
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Aguardar nova tentativa do GitHub Pages
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Publicar GitHub Pages - segunda tentativa
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
