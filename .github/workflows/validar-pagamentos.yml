name: CABW - Validar conversao de pagamentos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar bibliotecas
        run: python -m pip install google-auth requests
      - name: Ler planilha privada no Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/drive_to_pagamentos.py
      - name: Conferir mapeamento de colunas e historico
        run: python scripts/converter_pagamentos.py
      - name: Guardar somente resumo de conferencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validacao-pagamentos
          path: validacao-pagamentos.json
          if-no-files-found: ignore
